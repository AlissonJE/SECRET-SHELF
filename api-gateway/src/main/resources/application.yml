server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth
          uri: lb://auth-service
          predicates: [Path=/api/auth/**]
          filters: [StripPrefix=2]
        - id: books
          uri: lb://catalog-service
          predicates: [Path=/api/books/**]
          filters: [StripPrefix=2]
        - id: profile
          uri: lb://profile-service
          predicates: [Path=/api/profile/**]
          filters: [StripPrefix=2]
        - id: shelves
          uri: lb://shelf-service
          predicates: [Path=/api/shelves/**]
          filters: [StripPrefix=2]
        - id: locations
          uri: lb://location-service
          predicates: [Path=/api/locations/**]
          filters: [StripPrefix=2]
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ["${FRONTEND_ORIGIN:http://localhost:8080}"]
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: false
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
security:
  jwt:
    secret: ${JWT_SECRET:replace-with-at-least-32-random-bytes-for-local-development}
